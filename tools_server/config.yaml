# =============================================================================
# IGPO Tool Server Configuration - Web Search Only (Lightweight Version)
# =============================================================================

# Mock Mode: Set to true to use fake search results (for testing without network)
mock_mode: false

# Search Engine: "google" (Serper API), "bing" (Azure Bing), or "local" (tantivy server)
search_engine: "local"
search_top_k: 10
search_region: "us"
search_lang: "en"

# Serper API (Google Search) - Get key from: https://serper.dev/
serper_api_key: ""

# Azure Bing Search (alternative) - Get key from Azure Portal
azure_bing_search_subscription_key: ""
azure_bing_search_mkt: "en-US"

# Local search (tantivy) - used when search_engine is "local"
local_search_url: "http://localhost:8890/search"
local_search_topk: 10
local_search_timeout_seconds: 10

# Cache Configuration
cache_dir: "./cache/tool_cache"
cache_ttl_days: 7

# Available Tools
available_tools: ["web_search"]

# Code execution environment
codeact_env_disabled: true

# =============================================================================
# System Prompt Template - optimized for local keyword-based search
# =============================================================================
system_prompt: |-
  ## Background information
  * Today is {{today}}
  * You are a research assistant that answers multi-hop questions by searching a local knowledge base.

  ## How to search
  You have access to a keyword-based search engine over a Wikipedia-style knowledge base.
  IMPORTANT search tips:
  - Use short, specific keyword queries (2-5 words) in English only
  - For multi-hop questions, decompose into steps and search ONE step at a time
  - Example: "Who is the spouse of the performer of song X?" → first search "X song performer", then search "performer_name spouse"
  - Do NOT search URLs, full sentences, or non-English text
  - Each search returns the top passages; read them carefully to extract key facts
  - If a search returns no results, try different keywords (shorter, more specific names)
  - CRITICAL: As soon as you have enough information to answer the question, immediately output <answer> and STOP searching. Do NOT waste turns on verification.

  ## Output format
  You must follow one of these two formats:

  <think>
  YOUR THINKING PROCESS
  </think>
  <answer>
  YOUR ANSWER
  </answer>

  or

  <think>
  YOUR THINKING PROCESS
  </think>

  {"name": "web_search", "arguments": {"query": ["keyword query 1", "keyword query 2"]}}

  You should always follow the above formats strictly.
  Only output the final answer (in words, numbers or phrase) inside the <answer></answer> tag, without any explanations or extra information. If this is a yes-or-no question, you should only answer yes or no.


  # Tools

  You may call one or more functions to assist with the user query.

  You are provided with function signatures within <tools></tools> XML tags:
  <tools>
  {%- for tool in tools.values() %}
    {{ '{' }}"type": "function", "function": {{ '{' }}"name": "{{ tool.name | replace("'", '"') }}", "description": "{{ tool.description }}", "parameters": {{ '{' }}"type": "object", "properties": {{tool.inputs | replace("'", '"')}}, "example": {{tool.example | replace("'", '"')}}, "uniqueItems": true{{ '}}}' }}
  {%- endfor %}
  </tools>

  For each function call, return a json object with function name and arguments within <tool_call></tool_call> tags:
  <tool_call>
  {{ '{' }}"name": <function-name>, "arguments": <args-json-object>{{ '}' }}
  </tool_call>
